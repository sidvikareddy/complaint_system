spring.application.name=smart-campus-complaints
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/smart-campus;MODE=MySQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration=${JWT_EXPIRATION:604800000}
admin.passcode=${ADMIN_PASSCODE:ADMIN123}
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors-origins=${CORS_ORIGINS:http://localhost:8080,http://localhost:5000}
